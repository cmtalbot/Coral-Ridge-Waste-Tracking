name: Nightly Waste Report

on:
  schedule:
    # 06:05 UTC = 00:05 CST / 01:05 CDT, always after Chicago midnight.
    # GitHub may start it late; the script reports "yesterday" in Chicago time either way.
    - cron: '5 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override report date (YYYY-MM-DD). Leave blank to use last night automatically.'
        required: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send nightly waste report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          REPORT_DATE_OVERRIDE: ${{ github.event.inputs.date }}
        run: node scripts/send-nightly-report.mjs
